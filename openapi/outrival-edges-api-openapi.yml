openapi: 3.2.0
info:
  title: OutRival Edges API
  description: OutRival API documentation.
  version: '2.0'
  contact: {}
servers:
- url: https://api.outrival.com
tags:
- name: Edges
paths:
  /rest/v2/edges:
    get:
      operationId: EdgeController_findAll
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - Edges
      security:
      - api_key: []
      - bearer: []
      summary: Edge controller find all
      x-summary-source: derived
    post:
      operationId: EdgeController_createEdge
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEdgeDto'
      responses:
        '200':
          description: Create new edge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDto'
      tags:
      - Edges
      security:
      - api_key: []
      - bearer: []
      summary: Edge controller create edge
      x-summary-source: derived
  /rest/v2/edges/{id}:
    get:
      operationId: EdgeController_findOne
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Get by Edge ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDto'
      tags:
      - Edges
      security:
      - api_key: []
      - bearer: []
      summary: Edge controller find one
      x-summary-source: derived
    patch:
      operationId: EdgeController_updateEdge
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEdgeDto'
      responses:
        '200':
          description: Update by Edge ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDto'
      tags:
      - Edges
      security:
      - api_key: []
      - bearer: []
      summary: Edge controller update edge
      x-summary-source: derived
    delete:
      operationId: EdgeController_deleteEdge
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Delete by Edge ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDto'
      tags:
      - Edges
      security:
      - api_key: []
      - bearer: []
      summary: Edge controller delete edge
      x-summary-source: derived
components:
  schemas:
    CreateEdgeDto:
      type: object
      properties:
        workflowId:
          type: string
        sourceNodeId:
          type: string
        targetNodeId:
          type: string
        name:
          type: string
        functionCondition:
          type: string
        sourceHandlePosition:
          $ref: '#/components/schemas/HandlePosition'
        targetHandlePosition:
          $ref: '#/components/schemas/HandlePosition'
      required:
      - workflowId
      - sourceNodeId
      - targetNodeId
    HandlePosition:
      type: string
      enum:
      - LEFT
      - RIGHT
      - TOP
      - BOTTOM
    EdgeDto:
      type: object
      properties:
        id:
          type: string
        workflowId:
          type: string
        sourceNodeId:
          type: string
        targetNodeId:
          type: string
        name:
          type: string
        functionCondition:
          type: string
        sourceHandlePosition:
          $ref: '#/components/schemas/HandlePosition'
        targetHandlePosition:
          $ref: '#/components/schemas/HandlePosition'
      required:
      - id
      - workflowId
      - sourceNodeId
      - targetNodeId
    UpdateEdgeDto:
      type: object
      properties:
        workflowId:
          type: string
        sourceNodeId:
          type: string
        targetNodeId:
          type: string
        name:
          type: string
        functionCondition:
          type: string
        sourceHandlePosition:
          $ref: '#/components/schemas/HandlePosition'
        targetHandlePosition:
          $ref: '#/components/schemas/HandlePosition'
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
