aid: outrival
name: OutRival
description: >-
  OutRival is a conversational AI platform that deploys AI agents ("Digital Workers" / companions)
  to handle high-volume customer engagement across voice calls, SMS, and chat. Its REST API and
  Companion Builder let developers create and configure assistants, build multi-node conversation
  workflows, initiate outbound phone calls, upload knowledge files, manage organization API keys,
  and receive real-time server events over signed webhooks. OutRival serves higher education,
  travel, healthcare, insurance, home services, and financial services, and is SOC 2 Type 2
  attested. Surfaced as a portfolio company of Initialized Capital and enriched into the API
  Evangelist network from its published OpenAPI (v1 and v2), docs, and SDK.
